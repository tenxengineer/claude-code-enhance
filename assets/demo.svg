<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13">
  <!-- Drop shadow filter -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect x="20" y="20" width="940" height="680" rx="10" ry="10" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="940" height="36" rx="10" ry="10" fill="#11111b"/>
  <rect x="20" y="46" width="940" height="10" fill="#11111b"/>

  <!-- Traffic lights -->
  <circle cx="42" cy="38" r="6.5" fill="#f38ba8"/>
  <circle cx="62" cy="38" r="6.5" fill="#f9e2af"/>
  <circle cx="82" cy="38" r="6.5" fill="#a6e3a1"/>

  <!-- Title text -->
  <text x="490" y="42" fill="#7f849c" text-anchor="middle" font-size="12" font-weight="500">
    claude-code-enhance — /enhance demo
  </text>

  <!-- Terminal content -->
  <g transform="translate(40, 80)">
    <!-- Prompt line - typed -->
    <text fill="#cdd6f4">
      <tspan x="0" y="0" fill="#a6e3a1">❯</tspan>
      <tspan dx="6" fill="#cdd6f4">/enhance fix the bug where field area is computed wrong</tspan>
    </text>

    <!-- Loading indicator - subtle animated -->
    <text x="0" y="28" fill="#7f849c" font-style="italic">
      Loading codemap, lessons, and codebase context...
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </text>

    <!-- Output begins -->
    <text x="0" y="64" fill="#94e2d5" font-weight="600" font-size="14">
      # Enhanced Prompt
    </text>
    <text x="0" y="84" fill="#7f849c" font-style="italic">
      &gt; Original rough intent: fix the bug where field area is computed wrong
    </text>

    <!-- Intent class -->
    <text x="0" y="116" fill="#fab387" font-weight="600">## Intent class</text>
    <text x="0" y="134" fill="#cdd6f4">debug</text>

    <!-- Goal -->
    <text x="0" y="162" fill="#fab387" font-weight="600">## Goal</text>
    <text x="0" y="180" fill="#cdd6f4">Identify and fix the bug causing incorrect field area computation,</text>
    <text x="0" y="196" fill="#cdd6f4">preserving the distinction between areaHa (computed) and</text>
    <text x="0" y="212" fill="#cdd6f4">officialAreaHa (manual government quota override).</text>

    <!-- Scope -->
    <text x="0" y="240" fill="#fab387" font-weight="600">## Scope</text>
    <text x="0" y="258" fill="#a6e3a1" font-weight="600">**In:**</text>
    <text x="0" y="276" fill="#cdd6f4">- apps/api/src/fields/fields.service.ts</text>
    <text x="0" y="292" fill="#cdd6f4">- apps/api/src/fields/dto/{create,update}-field.dto.ts</text>
    <text x="0" y="308" fill="#cdd6f4">- PostGIS expression: ST_Area(geometry::geography) / 10000</text>

    <!-- Constraints -->
    <text x="0" y="336" fill="#fab387" font-weight="600">## Constraints</text>
    <text x="0" y="354" fill="#a6e3a1" font-weight="600">**Lessons that apply:**</text>
    <text x="0" y="372" fill="#cdd6f4">- </text>
    <text x="14" y="372" fill="#f9e2af" font-weight="600">L-DATA-001</text>
    <text x="98" y="372" fill="#cdd6f4"> — No fake seed data; use real polygons in regression test</text>

    <!-- Assumptions -->
    <text x="0" y="400" fill="#fab387" font-weight="600">## Implicit assumptions to confirm</text>
    <text x="0" y="418" fill="#cdd6f4">[ ] Which layer has the bug? (API / web / mobile / Prisma query)</text>
    <text x="0" y="434" fill="#cdd6f4">[ ] Do you have a reproduction case (specific field UUID + expected)?</text>
    <text x="0" y="450" fill="#cdd6f4">[ ] Backfill scope? (forward-only / all rows / audit-logged)</text>

    <!-- Skills -->
    <text x="0" y="478" fill="#fab387" font-weight="600">## Skills to invoke</text>
    <text x="0" y="496" fill="#cdd6f4">- </text>
    <text x="14" y="496" fill="#89b4fa" font-weight="600">superpowers:systematic-debugging</text>
    <text x="0" y="512" fill="#cdd6f4">- </text>
    <text x="14" y="512" fill="#89b4fa" font-weight="600">consult-scars</text>
    <text x="120" y="512" fill="#7f849c"> (already auto-fired)</text>
    <text x="0" y="528" fill="#cdd6f4">- </text>
    <text x="14" y="528" fill="#89b4fa" font-weight="600">codex</text>
    <text x="56" y="528" fill="#7f849c"> — adversarial review post-implementation</text>

    <!-- Risk -->
    <text x="0" y="556" fill="#fab387" font-weight="600">## Risk: </text>
    <text x="76" y="556" fill="#f9e2af" font-weight="700">medium</text>
    <text x="0" y="574" fill="#cdd6f4">Touches data integrity for core domain. Wrong backfill could destroy</text>
    <text x="0" y="590" fill="#cdd6f4">historical records — get backfill decision in writing first.</text>

    <!-- Submit prompt -->
    <text x="0" y="624" fill="#cdd6f4" font-weight="600">
      Submit this enhanced version (s), edit first (e), or scrap (x)?
    </text>

    <!-- Cursor -->
    <rect x="0" y="638" width="9" height="14" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
